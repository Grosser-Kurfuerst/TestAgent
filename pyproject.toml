[project]
name = "my-agent"
version = "0.1.0"
description = "A lightweight coding-agent skeleton with typed state and CLI scaffolding."
requires-python = ">=3.10"
dependencies = [
  "filelock>=3.18,<4",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
data = [
  "datasets>=5.0.0",
]
dev = [
  "pytest>=8.0.0",
]
opd-train = [
  "accelerate>=1.8,<2",
  "datasets>=5,<6",
  "huggingface-hub>=0.33,<2",
  "peft>=0.15,<1",
  "pyyaml>=6,<7",
  "safetensors>=0.5,<1",
  "torch>=2.7,<3",
  "transformers>=5.2,<=5.8",
]
opd-embed = [
  "huggingface-hub>=0.33,<2",
  "safetensors>=0.5,<1",
  "sentence-transformers>=5,<6",
  "torch>=2.7,<3",
  "transformers>=5.2,<=5.8",
]
memory-benchmark = [
  "datasets>=5,<6",
  "mem0ai>=2.0.13,<3",
  "scikit-learn>=1.7,<2",
]

[project.scripts]
my-agent = "my_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: requires locally prepared external runtime dependencies",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E402"]

[tool.setuptools.packages.find]
where = ["src"]
