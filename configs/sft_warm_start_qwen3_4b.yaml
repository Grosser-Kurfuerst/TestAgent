schema_version: agentcli-sft-warm-start-config-v1

model:
  name_or_path: Qwen/Qwen3-4B-Instruct-2507
  base_revision: cdbee75f17c01a7cc42f958dc650907174af0554
  tokenizer_revision: cdbee75f17c01a7cc42f958dc650907174af0554
  chat_template: model_default
  dtype: bfloat16

adapter:
  name: shared
  rank: 16
  alpha: 32
  dropout: 0.0
  target_modules: [q_proj, k_proj, v_proj, o_proj]
  task_type: CAUSAL_LM
  bias: none
  modules_to_save: []
  adapter_config_hash: sha256:fc2d911dc40bbf3965a70afab1547eea4102a2c1c54bd0a44cbf5b40cbc5f91c

data:
  canonical_schema: agentcli-canonical-sft-v1
  rendered_schema: agentcli-rendered-sft-v1
  dataset_manifest_schema: agentcli-sft-dataset-manifest-v1
  rendered_manifest_schema: agentcli-rendered-sft-manifest-v1
  cutoff_len: 8192
  train_dataset: agentcli_sft_train
  validation_dataset: agentcli_sft_validation
  dataset_dir: data/sft_warm_start/llamafactory

llamafactory:
  lock: integrations/llamafactory/lock.json
  stage: sft
  finetuning_type: lora
  template: qwen3
  train_on_prompt: false
  mask_history: true
  learning_rate: 0.00002
  num_train_epochs: 1
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 16
  lr_scheduler_type: cosine
  warmup_ratio: 0.03
  bf16: true

outputs:
  trainer_output: outputs/sft-runs/qwen3-4b-warm-start/trainer-output
  deployable_m0: outputs/opd/M0/adapter

evaluation:
  environment_exclusions:
    - sandbox_unavailable
    - fixture_setup_failed
    - required_dependency_unavailable
  minimum_fixtures:
    action_tool_call: 500
    finish: 100
    selection: 100
    writing: 100
    maintenance: 100
    real_end_to_end: 100
  gates:
    tool_call_parse_rate: 0.98
    tool_name_exists_rate: 0.99
    arguments_schema_valid_rate: 0.98
    real_execution_success_rate: 0.90
    finish_structure_valid_rate: 0.98
    selection_structure_valid_rate: 0.95
    writing_structure_valid_rate: 0.95
    maintenance_structure_valid_rate: 0.95
    reload_identity_rate: 1.0
    template_token_mask_parity_rate: 1.0
    tool_heavy_success_delta: 0.05
    general_code_max_regression: 0.02
