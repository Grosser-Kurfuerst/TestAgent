schema_version: opd-recollection-run-v1
root: ../runs/opd-smoke-recollection
baseline_commit: REPLACE_WITH_BASELINE_COMMIT
lockfile: ../uv.lock
m0_checkpoint: ../runs/opd-smoke-m0
m0_identity_manifest: ../runs/opd-smoke-m0/policy_identity_manifest.json

environment:
  AGENTCLI_MEMORY_EVOLVER_MODE: formal
  AGENTCLI_POLICY_DEVICE: cpu
  AGENTCLI_POLICY_DTYPE: float32

rounds:
  0:
    environment:
      AGENTCLI_MEMORY_DIR: "{memory_dir}"
      AGENTCLI_MEMORY_EVOLVER_DATASET_DIR: "{run_output}/evolver_datasets"
      AGENTCLI_MEMORY_EVOLVER_COLLECTION_ROUND: "{collection_round}"
      AGENTCLI_MEMORY_EVOLVER_DATASET_SPLIT: train
    collection_commands:
      - [uv, run, --extra, opd-train, my-agent, eval-manifest, --tasks, REPLACE_WITH_TRAIN_MANIFEST, --output-dir, "{run_output}", --mode, react, --max-steps, "8", --checkpoint, "{checkpoint}", --identity-manifest, "{identity_manifest}"]
      - [uv, run, my-agent, data, compute-opd-attribution, --run-dir, "{run_output}", --collection-round, "{collection_round}"]
      - [uv, run, --extra, opd-train, my-agent, opd, build-round, --run-dir, "{run_output}", --checkpoint, "{checkpoint}", --identity-manifest, "{identity_manifest}", --output, "{dataset_dir}", --collection-round, "{collection_round}"]
    training_command: [uv, run, --extra, opd-train, python, scripts/train_opd_evolver.py, --config, configs/opd_smoke_train.yaml, --checkpoint, "{checkpoint}", --identity-manifest, "{identity_manifest}", --learner-dataset, "{learner_dataset}", --export-manifest, "{export_manifest}", --output-dir, "{checkpoint_output}"]
  1:
    environment:
      AGENTCLI_MEMORY_DIR: "{memory_dir}"
      AGENTCLI_MEMORY_EVOLVER_DATASET_DIR: "{run_output}/evolver_datasets"
      AGENTCLI_MEMORY_EVOLVER_COLLECTION_ROUND: "{collection_round}"
      AGENTCLI_MEMORY_EVOLVER_DATASET_SPLIT: train
    collection_commands:
      - [uv, run, --extra, opd-train, my-agent, eval-manifest, --tasks, REPLACE_WITH_TRAIN_MANIFEST, --output-dir, "{run_output}", --mode, react, --max-steps, "8", --checkpoint, "{checkpoint}", --identity-manifest, "{identity_manifest}"]
      - [uv, run, my-agent, data, compute-opd-attribution, --run-dir, "{run_output}", --collection-round, "{collection_round}"]
      - [uv, run, --extra, opd-train, my-agent, opd, build-round, --run-dir, "{run_output}", --checkpoint, "{checkpoint}", --identity-manifest, "{identity_manifest}", --output, "{dataset_dir}", --collection-round, "{collection_round}"]
    training_command: [uv, run, --extra, opd-train, python, scripts/train_opd_evolver.py, --config, configs/opd_smoke_train.yaml, --checkpoint, "{checkpoint}", --identity-manifest, "{identity_manifest}", --learner-dataset, "{learner_dataset}", --export-manifest, "{export_manifest}", --output-dir, "{checkpoint_output}"]

numerical_reproduction:
  enabled: false
  training_tasks_total: 0
  source_revisions: {}
  model_revisions: {}
